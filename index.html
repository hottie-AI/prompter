<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프롬프트 리더</title>
<style>
  :root {
    --fs: 44px;
    --bg: #0c0c0d;
    --fg: #f4f2ec;
    --dim: rgba(244, 242, 236, .28);
    --accent: #ffd34d;
    --note: #7fa9bd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  [hidden] { display: none !important; }

  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    font-size: 15px;
  }
  button {
    font: inherit; color: var(--fg);
    background: rgba(255, 255, 255, .09);
    border: 0; border-radius: 8px; padding: 9px 14px;
    cursor: pointer; white-space: nowrap; touch-action: manipulation;
  }
  button:active { background: rgba(255, 255, 255, .18); }
  #micBtn.on { background: #c5221f; }
  #micBox { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #timer { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: rgba(255, 255, 255, .45); }
  #timer.on { color: var(--fg); }
  #editBtn.on { background: var(--accent); color: #1a1500; font-weight: 600; }
  #heard {
    flex: 1; min-width: 0; text-align: right;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    color: rgba(255, 255, 255, .42);
  }
  #heard.warn { color: #ff8a80; white-space: normal; }

  /* 챕터 진행 바 */
  #chapters {
    display: flex; align-items: center; gap: 6px;
    padding: 6px max(12px, env(safe-area-inset-right)) 6px max(12px, env(safe-area-inset-left));
    border-bottom: 1px solid rgba(255, 255, 255, .08);
    font-size: 13px;
  }
  #chapters > button { padding: 6px 10px; }
  #tabs {
    flex: 1; min-width: 0; position: relative;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .ch {
    flex: none; max-width: 13em; overflow: hidden; text-overflow: ellipsis;
    padding: 6px 11px; border-radius: 999px;
    background: transparent; border: 1px solid rgba(255, 255, 255, .16);
    color: rgba(255, 255, 255, .6);
  }
  .ch b { font-variant-numeric: tabular-nums; }
  .ch.done { background: rgba(255, 211, 77, .14); border-color: transparent; color: rgba(255, 211, 77, .6); }
  .ch.cur { background: var(--accent); border-color: var(--accent); color: #1a1500; font-weight: 700; }

  #stage { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
  #script {
    max-width: 24em; margin: 0 auto; padding: 0 6vw;
    font-size: var(--fs); font-weight: 700; line-height: 1.55; letter-spacing: -.01em;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .page { padding: 8vh 0 65vh; }
  .page h2 { margin: 0 0 1.4em; font-size: .5em; font-weight: 600; letter-spacing: 0; color: var(--accent); }
  #script p { margin: 0 0 .12em; }
  #script p.gap { height: .9em; margin: 0; }
  #script p.sub { margin: 1.2em 0 .8em; font-size: .55em; font-weight: 600; color: var(--note); }
  .w { cursor: pointer; transition: color .15s; }
  .w.read { color: var(--dim); }
  .w.cur { color: var(--accent); }
  .n { font-size: .72em; font-weight: 500; color: var(--note); }   /* 지문: 음성 추적에서 제외 */
  .next {
    display: block; width: 100%; margin-top: 1.6em; padding: .8em 1em;
    font-size: .5em; text-align: left; white-space: normal;
    background: transparent; border: 1px solid rgba(255, 255, 255, .22);
  }
  .next.ready { background: var(--accent); border-color: var(--accent); color: #1a1500; font-weight: 700; }

  #editor {
    flex: 1; width: 100%; border: 0; outline: 0; resize: none;
    background: #151517; color: var(--fg);
    font: inherit; font-size: max(20px, calc(var(--fs) * .55)); line-height: 1.6;
    padding: 24px 6vw 40vh;
  }
</style>
</head>
<body>
  <header id="bar">
    <div id="micBox">
      <button id="micBtn">음성 인식 시작</button>
      <div id="timer">00:00</div>
    </div>
    <div id="heard"></div>
    <button id="smallerBtn" aria-label="글자 작게">가−</button>
    <button id="biggerBtn" aria-label="글자 크게">가+</button>
    <button id="topBtn">처음으로</button>
    <button id="editBtn">편집</button>
  </header>
  <nav id="chapters">
    <button id="prevBtn" aria-label="이전 챕터">◀</button>
    <div id="tabs"></div>
    <button id="nextBtn" aria-label="다음 챕터">▶</button>
  </nav>
  <main id="stage"><div id="script"></div></main>
  <textarea id="editor" hidden spellcheck="false"></textarea>

<script type="text/plain" id="defaultScript">
01. 대본 넣기

오른쪽 위 편집 버튼을 누르세요.
이 글을 모두 지우고 대본을 붙여 넣은 뒤 완료를 누르면 이 기기에 저장됩니다.
</script>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), scriptEl = $('script'), editor = $('editor');
const micBtn = $('micBtn'), editBtn = $('editBtn'), heardEl = $('heard');
const navEl = $('chapters'), tabsEl = $('tabs');

const store = {
  get(k) { try { return localStorage.getItem('prompter.' + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('prompter.' + k, v); } catch {} },
};

// 파일에 담긴 기본 대본. 버전이 바뀌면 브라우저에 저장된 대본을 한 번 덮어쓴다.
const DEFAULT_SCRIPT = $('defaultScript').textContent.trim();
const SCRIPT_VER = '2026-11-21-full';

// ── 대본 상태 ─────────────────────────────────────────────
// "발화 글자" = 한글 음절·영문·숫자. 공백/문장부호는 음성 매칭에서 제외한다.
const SPOKEN = /[가-힣a-z0-9]/;
// 챕터 제목 줄: "* 01. 식전 안내", "04. 신랑 입장", "10-2. 신부 축가 이벤트"
const RE_CHAPTER = /^\s*\*?\s*(\d{1,2}(?:-\d+)?)\.\s*(\S.*)$/;
// 소제목 줄: "① …", "* ③ …", "# …" — 읽지 않는 줄
const RE_SUB = /^\s*(\*?\s*[①-⑳]|#)/;

let text;
if (store.get('ver') !== SCRIPT_VER) {
  text = DEFAULT_SCRIPT;
  store.set('text', text); store.set('ver', SCRIPT_VER); store.set('pos', 0); store.set('page', 0);
} else {
  text = store.get('text') ?? DEFAULT_SCRIPT;
}

let chapters = [];       // { num, title, el, tab, next, raw, start, end }  start/end = 발화 글자 범위
let page = 0;            // 화면에 보이는 챕터
let words = [];          // { el, start, end, raw, line, ch }  start/end = 발화 글자 인덱스, raw = 원문 오프셋
let jamo = [];           // 대본 전체의 자모 열
let jamoChar = [];       // 자모 인덱스 → 발화 글자 인덱스
let charJamoStart = [];  // 발화 글자 인덱스 → 첫 자모 인덱스
let total = 0;           // 발화 글자 수
let pos = 0;             // 읽은 발화 글자 수
let curWord = -1;        // 현재(다음에 읽을) 어절 인덱스
let editing = false;

// 한글 음절을 초·중·종성으로 분해 → 받침 하나 틀린 인식 결과도 부분 점수로 매칭된다.
function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return [1000 + ch.charCodeAt(0)];
  const out = [Math.floor(c / 588), 100 + Math.floor((c % 588) / 28)];
  if (c % 28) out.push(200 + (c % 28));
  return out;
}

// 대본을 챕터(페이지) → 줄 → 어절로 나눈다.
// (…) [ … ] 안의 글자와 "<-" 뒤는 지문으로 보고 표시만 하며 음성 추적에서 뺀다.
function render() {
  scriptEl.textContent = '';
  tabsEl.textContent = '';
  words = []; jamo = []; jamoChar = []; charJamoStart = []; chapters = [];
  let n = 0, raw = 0, line = 0, depth = 0, ch = null;

  const openChapter = (num, title, rawAt) => {
    const el = document.createElement('section');
    el.className = 'page';
    el.hidden = true;
    if (title) {
      const h = document.createElement('h2');
      h.textContent = num + '. ' + title;
      el.append(h);
    }
    ch = { num, title, el, raw: rawAt, start: n, end: n };
    chapters.push(ch);
    scriptEl.append(el);
    depth = 0;
  };

  for (const lineText of text.split('\n')) {
    const lineRaw = raw;
    raw += lineText.length + 1;

    const m = RE_CHAPTER.exec(lineText);
    if (m) { openChapter(m[1], m[2].trim(), lineRaw); continue; }

    if (!lineText.trim()) {
      depth = 0;   // 닫지 않은 괄호가 다음 문단까지 삼키지 않도록
      if (ch && ch.el.lastChild && ch.el.lastChild.className !== 'gap') {
        const g = document.createElement('p');
        g.className = 'gap';
        ch.el.append(g);
      }
      continue;
    }
    if (!ch) openChapter('', '', lineRaw);

    const p = document.createElement('p');
    ch.el.append(p);
    if (depth === 0 && RE_SUB.test(lineText)) {
      p.className = 'sub';
      p.textContent = lineText.trim().replace(/^[*#]\s*/, '');
      continue;
    }

    let tok = '', tokNote = false, tokRaw = 0, arrow = false, hasWord = false;
    const flush = () => {
      if (!tok) return;
      const el = document.createElement('span');
      el.textContent = tok;
      if (tokNote) {
        el.className = 'n';
      } else {
        el.className = 'w';
        el.dataset.i = words.length;
        const start = n;
        for (const c of tok.toLowerCase()) {
          if (!SPOKEN.test(c)) continue;
          charJamoStart.push(jamo.length);
          for (const j of decompose(c)) { jamo.push(j); jamoChar.push(n); }
          n++;
        }
        words.push({ el, start, end: n, raw: tokRaw, line, ch: chapters.length - 1 });
        hasWord = true;
      }
      p.append(el);
      tok = '';
    };
    for (let i = 0; i < lineText.length; i++) {
      const c = lineText[i];
      if (/\s/.test(c)) { flush(); p.append(' '); continue; }
      if (!arrow && depth === 0 && c === '<' && lineText[i + 1] === '-') { flush(); arrow = true; }
      if (c === '(' || c === '[') { if (depth === 0 && !arrow) flush(); depth++; }
      const note = arrow || depth > 0;
      if (tok && note !== tokNote) flush();
      if (!tok) { tokNote = note; tokRaw = lineRaw + i; }
      tok += c;
      if ((c === ')' || c === ']') && depth > 0) { depth--; if (depth === 0 && !arrow) flush(); }
    }
    flush();
    if (hasWord) line++;
    ch.end = n;
  }
  if (!chapters.length) openChapter('', '', 0);
  charJamoStart.push(jamo.length);
  total = n;
  curWord = -1;

  // 챕터 탭 + 각 페이지 끝의 "다음" 버튼
  chapters.forEach((c, i) => {
    const tab = document.createElement('button');
    tab.className = 'ch';
    tab.dataset.i = i;
    tab.title = c.title;
    const b = document.createElement('b');
    b.textContent = c.num || '서두';
    const short = c.title.split(/\s+[—–-]\s+|\s*[(\[]/)[0].replace(/[.\s]+$/, '');
    tab.append(b, short ? ' ' + short : '');
    tabsEl.append(tab);
    c.tab = tab;

    const nx = chapters[i + 1];
    if (nx) {
      const btn = document.createElement('button');
      btn.className = 'next';
      btn.textContent = '다음 ▶  ' + (nx.num ? nx.num + '. ' : '') + nx.title;
      btn.onclick = () => goPage(i + 1);
      c.el.append(btn);
      c.next = btn;
    }
  });
  syncNav();
}

function syncNav() { navEl.hidden = editing || chapters.length < 2; }

// 페이지(챕터) 이동. p를 주지 않으면 그 챕터의 처음부터.
function goPage(i, p) {
  if (i < 0 || i >= chapters.length) return;
  page = i;
  chapters.forEach((c, k) => {
    c.el.hidden = k !== i;
    c.tab.classList.toggle('cur', k === i);
    c.tab.classList.toggle('done', k < i);
  });
  const tab = chapters[i].tab;
  tabsEl.scrollTo({ left: tab.offsetLeft - (tabsEl.clientWidth - tab.offsetWidth) / 2, behavior: 'smooth' });
  scrollStage(0, false);
  setPos(p ?? chapters[i].start, false);
  // 챕터 처음으로 들어올 때는 제목·지문부터 보이도록 맨 위에서 시작한다. (첫 대사가 화면 밖이면 대사 위치로)
  if (p === undefined) {
    const w = words[curWord];
    if (!w || w.ch !== i || w.el.offsetTop + w.el.offsetHeight <= stage.clientHeight * 0.8) scrollStage(0, false);
  }
  store.set('page', i);
}

// 대본 화면 스크롤. 브라우저의 부드러운 스크롤은 도중에 끊을 수 없어서(페이지를 넘긴 뒤에도 계속 움직임)
// 직접 움직이고, 새 스크롤이 오면 진행 중이던 것을 취소한다.
let scrollAnim = 0;
function scrollStage(top, smooth) {
  cancelAnimationFrame(scrollAnim);
  if (!smooth) { stage.scrollTop = top; return; }
  const from = stage.scrollTop, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 350);
    stage.scrollTop = from + (top - from) * (1 - (1 - k) ** 3);
    if (k < 1) scrollAnim = requestAnimationFrame(step);
  };
  scrollAnim = requestAnimationFrame(step);
}

// 읽은 위치 설정. 현재 페이지(챕터) 범위를 벗어나지 않는다.
function setPos(p, smooth = true) {
  const c = chapters[page];
  pos = Math.max(c.start, Math.min(c.end, p));
  let i = words.findIndex(w => w.end > pos);
  if (i < 0) i = words.length;
  if (i !== curWord) {
    const lo = curWord < 0 ? 0 : Math.min(i, curWord);
    const hi = curWord < 0 ? words.length - 1 : Math.max(i, curWord);
    for (let k = lo; k <= hi && k < words.length; k++) {
      words[k].el.classList.toggle('read', k < i);
      words[k].el.classList.toggle('cur', k === i);
    }
    curWord = i;
  }
  if (c.next) c.next.classList.toggle('ready', pos >= c.end);   // 챕터를 다 읽으면 "다음" 버튼 강조
  scrollToCur(smooth);
  store.set('pos', pos);
}

function scrollToCur(smooth = true) {
  const w = words[curWord];
  const el = w && w.ch === page ? w.el : chapters[page].next;   // 다 읽었으면 "다음" 버튼으로
  if (!el) return;
  scrollStage(Math.max(0, el.offsetTop - stage.clientHeight * 0.35), smooth);
}

// ── 음성 → 위치 추적 ──────────────────────────────────────
// 최근에 들린 글자(꼬리)를 대본의 현재 위치 주변에서 근사 검색(Sellers 편집 거리)해
// 가장 잘 맞는 지점의 끝으로 커서를 옮긴다. 음성으로는 앞으로만, 현재 챕터 안에서만 이동하고,
// 챕터의 마지막 대사까지 읽으면 다음 페이지로 자동으로 넘어간다.
const TAIL = 10;   // 매칭에 쓰는 최근 글자 수
const BACK = 16;   // 현재 위치 뒤쪽 탐색 범위(글자) — TAIL보다 커야 "제자리" 매칭이 성립
const AHEAD = 60;  // 앞쪽 탐색 범위(글자) — 몇 어절 건너뛰어도 따라잡는다

const AUTO_NEXT_MS = 1000;   // 챕터를 다 읽은 뒤 다음 페이지로 넘어가기까지의 여유
let autoTimer = null;
let lastHeard = '';   // 가장 최근에 들린 발화 글자열
let flipTail = '';    // 자동으로 넘어가던 순간까지 들린 말의 꼬리

// 음성으로 챕터 끝까지 읽으면 잠시 뒤 다음 페이지로 넘긴다. 그 사이 직접 이동했으면 취소.
function scheduleAutoNext() {
  const ci = page;
  if (autoTimer || ci >= chapters.length - 1) return;
  autoTimer = setTimeout(() => {
    autoTimer = null;
    if (editing || page !== ci || pos < chapters[ci].end) return;
    flipTail = lastHeard.slice(-TAIL);
    goPage(ci + 1);
  }, AUTO_NEXT_MS);
}

function onHeard(transcript) {
  const c = chapters[page];
  let heard = [];
  for (const ch of transcript.toLowerCase()) if (SPOKEN.test(ch)) heard.push(ch);
  lastHeard = heard.join('');
  if (editing || pos >= c.end) return;
  // 방금 넘어온 페이지에서는, 이전 챕터에서 이미 읽은 말을 다시 매칭에 쓰지 않는다.
  if (flipTail) {
    const k = lastHeard.lastIndexOf(flipTail);
    if (k >= 0) heard = heard.slice(k + flipTail.length);
    else flipTail = '';
  }
  const tail = heard.slice(-TAIL);
  if (tail.length < 3) return;
  const pat = tail.flatMap(decompose);
  const m = pat.length;
  const limit = Math.floor(m * 0.25);
  const ahead = tail.length >= 6 ? AHEAD : 15;   // 짧은 조각으로는 멀리 점프하지 않는다
  const from = charJamoStart[Math.max(c.start, pos - BACK)];
  const to = charJamoStart[Math.min(c.end, pos + ahead)];

  let prev = new Array(m + 1), cur = new Array(m + 1);
  for (let i = 0; i <= m; i++) prev[i] = i;
  let best = -1, bestCost = Infinity;
  for (let j = from; j < to; j++) {
    cur[0] = 0;
    const t = jamo[j];
    for (let i = 1; i <= m; i++) {
      cur[i] = Math.min(prev[i - 1] + (pat[i - 1] !== t ? 1 : 0), prev[i] + 1, cur[i - 1] + 1);
    }
    const end = jamoChar[j] + 1;
    // 같은 문구가 반복될 때는 현재 위치에 가까운 쪽을 고른다.
    const cost = cur[m] + Math.abs(end - pos) * 0.02;
    if (cost <= limit && cost < bestCost) { bestCost = cost; best = end; }
    [prev, cur] = [cur, prev];
  }
  if (best > pos) {
    setPos(best);
    if (pos >= c.end) scheduleAutoNext();
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, retryDelay = 200, wake = null;

function showHeard(msg, warn = false) {
  heardEl.textContent = msg;
  heardEl.classList.toggle('warn', warn);
}

async function keepAwake(on) {
  try {
    if (on) wake = await navigator.wakeLock?.request('screen');
    else { await wake?.release(); wake = null; }
  } catch {}
}

// 타이머: 듣는 동안만 흐르고, 정지하면 멈췄다가 다시 시작하면 이어서 센다.
const timerEl = $('timer');
let elapsed = 0, timerFrom = 0, timerId = null;   // elapsed = 누적 ms

function drawTimer() {
  const s = Math.floor((elapsed + (timerId ? Date.now() - timerFrom : 0)) / 1000);
  const mm = String(Math.floor(s / 60) % 60).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  timerEl.textContent = (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + mm + ':' + ss;
}

function runTimer(on) {
  if (on && !timerId) { timerFrom = Date.now(); timerId = setInterval(drawTimer, 250); }
  else if (!on && timerId) { elapsed += Date.now() - timerFrom; clearInterval(timerId); timerId = null; }
  timerEl.classList.toggle('on', on);
  drawTimer();
}

function resetTimer() {
  elapsed = 0;
  timerFrom = Date.now();
  drawTimer();
}

function setListening(on) {
  listening = on;
  runTimer(on);
  micBtn.classList.toggle('on', on);
  micBtn.textContent = on ? '● 듣는 중 (정지)' : '음성 인식 시작';
  keepAwake(on);
}

function startMic() {
  if (!SR) {
    showHeard('이 브라우저는 음성 인식을 지원하지 않습니다. Mac은 Chrome/Safari, iPad는 Safari를 사용하세요.', true);
    return;
  }
  rec = new SR();
  rec.lang = 'ko-KR';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    retryDelay = 200;
    let t = '';
    for (let i = Math.max(0, e.results.length - 3); i < e.results.length; i++) t += e.results[i][0].transcript + ' ';
    showHeard(t.trim().slice(-40));
    onHeard(t);
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      setListening(false);
      showHeard('마이크/음성 인식 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요. (https 또는 localhost 주소에서만 동작. iPad는 설정 > 일반 > 키보드 > 받아쓰기 활성화도 필요)', true);
    } else if (e.error === 'audio-capture') {
      setListening(false);
      showHeard('마이크를 사용할 수 없습니다. 다른 앱이 마이크를 쓰고 있지 않은지 확인하고 다시 시작해 주세요.', true);
    } else if (e.error === 'network') {
      retryDelay = 2000;
      showHeard('음성 인식 서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요. (재시도 중)', true);
    }
  };
  // 브라우저가 침묵·시간 제한으로 인식을 끊으면 자동으로 다시 시작한다.
  let started = false;
  rec.onstart = () => { started = true; };
  rec.onend = () => {
    if (!listening) return;
    // 한 번도 시작되지 못한 채 끝났다면(권한 창 대기 등) 재시작하지 않는다.
    // 재요청이 반복되면 권한 창이 계속 새로 떠서 버튼이 눌리지 않을 수 있다.
    if (!started) { setListening(false); return; }
    setTimeout(() => { if (listening) try { rec.start(); } catch {} }, retryDelay);
  };
  try {
    rec.start();
    setListening(true);
    showHeard('');
  } catch (err) {
    showHeard('음성 인식을 시작할 수 없습니다: ' + err.message, true);
  }
}

function stopMic() {
  setListening(false);
  try { rec?.stop(); } catch {}
}

document.addEventListener('visibilitychange', () => {
  if (listening && document.visibilityState === 'visible') keepAwake(true);
});

// ── 저장 ──────────────────────────────────────────────────
// "프롬프터 실행"(localhost 서버)으로 열었을 때: 브라우저 저장소와 폴더의 '대본.txt' 파일 양쪽에 저장한다.
// 파일이 기준이고, 파일에 쓰지 못한 편집이 남아 있으면(unsaved) 다음에 열 때 브라우저 쪽을 파일에 다시 올린다.
// 그 외 주소(iPad에서 여는 웹 페이지)로 열었을 때: 그 기기의 브라우저 저장소에만 저장한다.
const FILE_SAVE = ['localhost', '127.0.0.1'].includes(location.hostname);
const SAVED = FILE_SAVE ? '저장됨 (대본.txt)' : '저장됨 (이 기기)';
const SAVE_FAIL = FILE_SAVE
  ? '파일에 저장하지 못했습니다. 지금은 이 브라우저에만 저장됩니다 — "프롬프터 실행" 파일로 다시 열어 주세요.'
  : '이 기기에 저장하지 못했습니다. 개인정보 보호 브라우징 탭이 아닌 일반 탭에서 열어 주세요.';
let saveChain = Promise.resolve();

function persist(value) {
  store.set('text', value);
  if (!FILE_SAVE) return Promise.resolve(store.get('text') === value);
  store.set('unsaved', '1');
  saveChain = saveChain.then(async () => {
    try {
      const r = await fetch('script', { method: 'PUT', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: value });
      if (!r.ok) throw new Error(r.status);
      if (store.get('text') === value) store.set('unsaved', '');
      store.set('synced', '1');
      return true;
    } catch { return false; }
  });
  return saveChain;
}

// 시작할 때 '대본.txt'와 맞춘다.
async function syncWithFile() {
  if (!FILE_SAVE) return;
  let r;
  try { r = await fetch('script', { cache: 'no-store' }); } catch { return; }   // 서버 없이 열었으면 브라우저 저장소만 쓴다
  const push = async () => { if (!(await persist(text))) showHeard(SAVE_FAIL, true); };
  if (store.get('unsaved') || r.status === 404) return push();   // 못 올린 편집이 있거나 파일이 아직 없음
  if (!r.ok) return;
  const fileText = (await r.text()).replace(/\r\n?/g, '\n');
  // 이 브라우저에만 있던 편집(파일 저장 기능이 생기기 전)을 파일로 옮긴다.
  if (!store.get('synced') && text !== DEFAULT_SCRIPT && fileText === DEFAULT_SCRIPT) return push();
  store.set('synced', '1');
  if (fileText === text || editing) return;
  text = fileText;
  store.set('text', text);
  render();
  goPage(Math.min(page, chapters.length - 1), pos);
}

// ── 편집 ──────────────────────────────────────────────────
let editorDirty = false, typingTimer = null;

// 입력하는 즉시 저장한다 ("완료"를 누르지 않고 닫아도 남는다).
editor.addEventListener('input', () => {
  editorDirty = true;
  store.set('text', editor.value);
  if (FILE_SAVE) store.set('unsaved', '1');
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => persist(editor.value), 800);
});

// 지금 읽는 위치의 원문 오프셋
function rawNow() {
  const w = words[curWord];
  if (w && w.ch === page) return w.raw;
  const nx = chapters[page + 1];
  return nx ? nx.raw - 1 : text.length;   // 챕터를 다 읽었으면 그 챕터의 끝
}

function openEditor() {
  const raw = Math.max(0, rawNow());
  editing = true;
  editorDirty = false;
  syncNav();
  editor.value = text;
  stage.hidden = true;
  editor.hidden = false;
  editBtn.textContent = '완료';
  editBtn.classList.add('on');
  editor.focus();
  editor.setSelectionRange(raw, raw);
  editor.scrollTop = Math.max(0, editor.scrollHeight * (raw / Math.max(1, text.length)) - editor.clientHeight / 3);
}

function closeEditor() {
  const old = text, neu = editor.value;
  // 읽던 위치(원문 오프셋)를 수정 후에도 유지한다.
  let raw = Math.max(0, rawNow());
  if (neu !== old) {
    let a = 0;
    while (a < old.length && a < neu.length && old[a] === neu[a]) a++;
    let b = 0;
    while (b < old.length - a && b < neu.length - a && old[old.length - 1 - b] === neu[neu.length - 1 - b]) b++;
    if (raw >= old.length - b) raw += neu.length - old.length;  // 읽던 위치보다 앞을 고침 → 길이 차만큼 이동
    else if (raw > a) {
      // 읽던 위치가 고친 구간 안(앞뒤 여러 곳을 함께 고친 경우 포함) → 읽던 자리의 글귀로 다시 찾는다.
      let found = -1;
      for (const len of [30, 12]) {
        const anchor = old.slice(raw, raw + len);
        for (let i = neu.indexOf(anchor); i !== -1; i = neu.indexOf(anchor, i + 1)) {
          if (found < 0 || Math.abs(i - raw) < Math.abs(found - raw)) found = i;
        }
        if (found >= 0) break;
      }
      raw = found >= 0 ? found : a;                             // 못 찾으면 고친 곳 시작으로
    }
    text = neu;
  }
  clearTimeout(typingTimer);
  if (neu !== old || editorDirty) {
    persist(neu).then(ok => showHeard(ok ? SAVED : SAVE_FAIL, !ok));
  }
  editorDirty = false;
  editing = false;
  editor.hidden = true;
  stage.hidden = false;
  editBtn.textContent = '편집';
  editBtn.classList.remove('on');
  render();
  let ci = 0;
  chapters.forEach((c, k) => { if (c.raw <= raw) ci = k; });
  const w = words.find(w => w.ch === ci && w.raw >= raw && w.end > w.start);
  goPage(ci, w ? w.start : chapters[ci].end);
}

// ── 조작 ──────────────────────────────────────────────────
// 현재 페이지 안에서 줄 단위 이동
function moveLine(d) {
  const inPage = words.filter(w => w.ch === page && w.end > w.start);
  if (!inPage.length) return;
  const cur = words[curWord];
  const line = cur && cur.ch === page ? cur.line : inPage[inPage.length - 1].line + 1;
  const w = inPage.find(w => w.line === line + d);
  if (w) setPos(w.start);
}

function setFontSize(px) {
  px = Math.max(24, Math.min(120, px));
  document.documentElement.style.setProperty('--fs', px + 'px');
  store.set('size', px);
  scrollToCur(false);
}
const fontSize = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'), 10);

micBtn.onclick = () => { listening ? stopMic() : startMic(); micBtn.blur(); };
editBtn.onclick = () => { editing ? closeEditor() : openEditor(); editBtn.blur(); };
$('smallerBtn').onclick = e => { setFontSize(fontSize() - 4); e.currentTarget.blur(); };
$('biggerBtn').onclick = e => { setFontSize(fontSize() + 4); e.currentTarget.blur(); };
$('topBtn').onclick = e => { if (!editing) { goPage(0); resetTimer(); } e.currentTarget.blur(); };
$('prevBtn').onclick = e => { goPage(page - 1); e.currentTarget.blur(); };
$('nextBtn').onclick = e => { goPage(page + 1); e.currentTarget.blur(); };

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.ch');
  if (tab) { goPage(+tab.dataset.i); tab.blur(); }
});

// 어절을 누르면 그 위치로 이동 (인식이 엇나갔을 때 바로잡기)
scriptEl.addEventListener('click', e => {
  const el = e.target.closest('.w');
  if (el) setPos(words[+el.dataset.i].start);
});

document.addEventListener('keydown', e => {
  if (editing) {
    if (e.key === 'Escape') closeEditor();
    return;
  }
  if (e.key === 'ArrowDown') { e.preventDefault(); moveLine(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveLine(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); goPage(page + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goPage(page - 1); }
});

window.addEventListener('resize', () => { if (!editing) scrollToCur(false); });

// ── 시작 ──────────────────────────────────────────────────
const savedSize = parseInt(store.get('size'), 10);
if (savedSize) document.documentElement.style.setProperty('--fs', savedSize + 'px');
render();
goPage(Math.min(chapters.length - 1, parseInt(store.get('page'), 10) || 0), parseInt(store.get('pos'), 10) || 0);
syncWithFile();
</script>
</body>
</html>
